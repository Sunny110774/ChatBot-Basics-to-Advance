<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning with Naveen | Chatbot Lab</title>
<style>
:root{--navy:#102746;--blue:#2876d2;--cyan:#25b6df;--purple:#805ac2;--green:#299e70;--gold:#eab037;--ink:#1c2b3b;--muted:#6c7b8b;--line:#dfe6ee;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:245px 235px minmax(320px,1fr);height:100vh}.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{padding:18px 15px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy)}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:5px}.bots{padding:9px;display:grid;gap:5px}.bot{border:1px solid transparent;background:white;text-align:left;padding:10px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:12px}.bot.active{background:#edf4ff;border-color:#c9dcfb;color:#174d98;font-weight:700}.bot span{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:4px}.histhead{padding:12px 10px 8px;font-size:11px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.new{border:0;background:var(--navy);color:white;border-radius:7px;padding:7px;cursor:pointer;font-size:10px}.history{padding:0 7px 12px;overflow:auto}.item{width:100%;text-align:left;border:1px solid transparent;background:white;padding:9px;border-radius:8px;cursor:pointer;margin:3px 0;color:var(--ink);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.active{background:#f1f5f9;border-color:var(--line)}.item small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:white;border-bottom:1px solid var(--line)}.tt{font-weight:800;color:var(--navy);font-size:15px}.tt small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:3px}.status{font-size:10px;color:var(--muted);background:#f3f6fa;border-radius:99px;padding:7px 9px}.messages{flex:1;overflow:auto;padding:22px clamp(16px,4vw,60px);display:flex;flex-direction:column;gap:14px}.welcome{max-width:700px;margin:auto;text-align:center;padding:22px}.symbol{font-size:34px}.welcome h1{font-size:24px;color:var(--navy);margin:12px 0 8px}.welcome p{color:var(--muted);line-height:1.6;font-size:13px}.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.quick button{border:1px solid var(--line);background:white;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:11px}.msg{max-width:820px;width:fit-content;min-width:160px;padding:13px 15px;border:1px solid var(--line);background:white;border-radius:13px;line-height:1.55;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#eaf2ff;border-color:#d2e2fb}.msg.assistant{align-self:flex-start}.meta{font-size:9px;color:var(--muted);margin-top:8px;border-top:1px solid #edf0f4;padding-top:7px}.composerwrap{padding:12px 22px 17px;background:linear-gradient(transparent,var(--bg) 20%)}.composer{max-width:900px;margin:auto;background:white;border:1px solid #ccd6e2;border-radius:14px;padding:7px;display:flex;align-items:flex-end;gap:8px}.composer textarea{border:0;outline:0;resize:vertical;flex:1;min-height:42px;max-height:130px;padding:11px;font:inherit;font-size:13px;color:var(--ink)}.send{background:var(--navy);color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer}.send:disabled{opacity:.5}.foot{text-align:center;color:var(--muted);font-size:9px;margin-top:7px}@media(max-width:800px){.app{grid-template-columns:175px minmax(280px,1fr)}.botside{display:none}.messages{padding:14px}.top{padding:0 13px}}@media(max-width:550px){.app{grid-template-columns:65px minmax(0,1fr)}.brand{padding:12px 5px;font-size:10px}.brand small{display:none}.bots{padding:4px}.bot{font-size:9px;padding:8px 3px}.bot span{display:none}.histhead{font-size:0;padding:7px 3px}.new{font-size:8px;padding:5px}.item{font-size:9px;padding:6px}.item small{display:none}.status{display:none}}
</style></head><body><div class="app">
<aside class="side botside"><div class="brand">Learning with Naveen<small>ChatBot — Basics to advance</small></div><div class="bots">
<button class="bot active" data-bot="basic">01 · Basic Chatbot<span>Rules & fixed responses</span></button><button class="bot" data-bot="generative">02 · Generative AI<span>LLM-generated answers</span></button><button class="bot" data-bot="rag">03 · RAG<span>Knowledge-grounded answers</span></button><button class="bot" data-bot="automation">04 · AI Automation<span>Tools & defined actions</span></button><button class="bot" data-bot="agentic">05 · Agentic AI<span>Plan, act, adapt, verify</span></button></div></aside>
<aside class="side"><div class="brand">Conversations<small id="hsub">Basic Chatbot history</small></div><div class="histhead">RECENT <button class="new" id="new">+ New chat</button></div><div class="history" id="history"></div></aside>
<main class="main"><header class="top"><div class="tt" id="title">01 · Basic Chatbot<small>Rules and predefined responses</small></div><div class="status" id="status">Checking server…</div></header><section class="messages" id="messages"></section><div class="composerwrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Ask a question…" required></textarea><button class="send" id="send">Send ↑</button></form><div class="foot">Learning prototype · Demo tools do not change real systems · Review before acting</div></div></main></div>
<script>
const bots={basic:{title:"01 · Basic Chatbot",sub:"Rules and predefined responses",symbol:"💬"},generative:{title:"02 · Generative AI",sub:"LLM-generated answers",symbol:"✨"},rag:{title:"03 · RAG",sub:"Retrieval-augmented generation",symbol:"📚"},automation:{title:"04 · AI Automation",sub:"LLM plus allow-listed demo tools",symbol:"⚙️"},agentic:{title:"05 · Agentic AI",sub:"Bounded plan, act, observe and verify",symbol:"🎯"}};
let bot="basic",cid=null,busy=false;const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function date(s){try{return new Date(s).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch{return""}}
function welcome(){$("messages").innerHTML=`<div class="welcome"><div class="symbol">${bots[bot].symbol}</div><h1>${bots[bot].title}</h1><p>${bots[bot].sub}. Ask a question below. Switch bots to compare capabilities.</p><div class="quick"><button>Explain a declined payment</button><button>What is the leave policy?</button><button>Help me draft an email</button></div></div>`;document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{$("input").value=b.textContent;$("input").focus()})}
function add(role,text,meta){$("messages").querySelector(".welcome")?.remove();let d=document.createElement("div");d.className="msg "+role;d.textContent=text;if(meta){let m=document.createElement("div");m.className="meta";let p=[];if(meta.sources?.length)p.push("Sources: "+meta.sources.map(x=>x.source).join(", "));if(meta.tools?.length)p.push("Tools: "+meta.tools.map(x=>x.tool).join(", "));if(meta.mode)p.push("Mode: "+meta.mode);m.textContent=p.join(" · ");d.appendChild(m)}$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});let d=await r.json().catch(()=>({detail:"Server response could not be read"}));if(!r.ok)throw Error(d.detail||"Request failed");return d}
async function refresh(){let list=await api("/api/conversations?bot="+bot);$("history").innerHTML="";if(!list.length){$("history").innerHTML='<div style="padding:10px;color:#8996a5;font-size:11px">No chats yet. Start a conversation.</div>';return}list.forEach(x=>{let b=document.createElement("button");b.className="item"+(x.id===cid?" active":"");b.innerHTML=esc(x.title)+"<small>"+date(x.updated_at)+"</small>";b.onclick=()=>open(x.id);$("history").appendChild(b)})}
async function fresh(){let x=await api("/api/conversations",{method:"POST",body:JSON.stringify({bot})});cid=x.id;welcome();await refresh();$("input").focus()}
async function open(id){let d=await api("/api/conversations/"+id);cid=id;$("messages").innerHTML="";d.messages.forEach(m=>add(m.role,m.content));await refresh()}
async function switchBot(b){bot=b;cid=null;document.querySelectorAll(".bot").forEach(x=>x.classList.toggle("active",x.dataset.bot===bot));$("title").innerHTML=esc(bots[bot].title)+"<small>"+esc(bots[bot].sub)+"</small>";$("hsub").textContent=bots[bot].title+" history";await refresh();welcome()}
document.querySelectorAll(".bot").forEach(b=>b.onclick=()=>switchBot(b.dataset.bot));$("new").onclick=()=>fresh();
$("form").onsubmit=async e=>{e.preventDefault();if(busy)return;let text=$("input").value.trim();if(!text)return;busy=true;$("send").disabled=true;$("input").value="";try{if(!cid)await fresh();add("user",text);let wait=document.createElement("div");wait.className="msg assistant";wait.textContent="Thinking…";$("messages").appendChild(wait);try{let d=await api("/api/chat",{method:"POST",body:JSON.stringify({conversation_id:cid,bot,message:text})});wait.remove();add("assistant",d.answer,d.metadata);await refresh()}catch(err){wait.remove();add("assistant","Could not complete request: "+err.message)}}catch(err){add("assistant","Could not create conversation: "+err.message)}finally{busy=false;$("send").disabled=false;$("input").focus()}};
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
api("/api/health").then(h=>{$("status").textContent=h.llm_configured?"Claude connected · "+h.model:"Anthropic key needed";$("status").style.color=h.llm_configured?"#227a50":"#9a6200"}).catch(()=>$("status").textContent="Start backend to connect");switchBot("basic").catch(welcome);
</script></body></html>
